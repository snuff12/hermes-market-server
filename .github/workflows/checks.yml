name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/setup.sh
        env:
          HERMES_MARKET_PYTHON: python
      - run: .venv/bin/python scripts/check_english.py
      - run: .venv/bin/python -m pytest -q
      - name: Select browser
        working-directory: web
        run: |
          if command -v google-chrome >/dev/null; then
            market_chrome_path="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
            market_chrome_path="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          fi
          printf 'CHROME_PATH=%s\n' "$market_chrome_path" >> "$GITHUB_ENV"
      - name: Browser integration
        working-directory: web
        run: npm run test:e2e
